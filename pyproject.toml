[tool.poetry]
name = "imputation-showcase"
version = "0.1.0"
description = "Showcase of imputation techniques"
authors = ["Diogo Ribeiro <dfr@esmad.ipp.pt>"]
license = "MIT"
readme = "README.md"
packages = [{include = "imputation_showcase"}]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.0"
numpy = "^1.24"
scikit-learn = "^1.4"
fancyimpute = "0.7.0"
ppca = "^0.0.4"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
flake8 = "^6.0"
mypy = "^1.8"
coverage = "^7.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
max-line-length = 88

[tool.mypy]
ignore_missing_imports = true
