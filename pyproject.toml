[project]
name = "imputation-methods"
version = "0.2.0"
description = "A unified pandas API for 40+ missing-data imputation methods: statistical, time-series, regression, ensemble and matrix-completion."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }]
maintainers = [{ name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }]
keywords = [
    "imputation",
    "missing-data",
    "missing-values",
    "data-cleaning",
    "data-preprocessing",
    "pandas",
    "scikit-learn",
    "time-series",
    "statistics",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Plotting libraries used by the notebooks, examples and figure scripts.
viz = ["matplotlib>=3.7", "seaborn>=0.13"]

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/imputation-methods"
Documentation = "https://diogoribeiro7.github.io/imputation-methods/"
Repository = "https://github.com/DiogoRibeiro7/imputation-methods"
Issues = "https://github.com/DiogoRibeiro7/imputation-methods/issues"
Changelog = "https://github.com/DiogoRibeiro7/imputation-methods/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
lint = [
    "mypy>=1.13",
    "pandas-stubs>=2.0",
    "pre-commit>=3.5",
    "ruff>=0.8",
]
docs = [
    # MkDocs 2.0 drops the plugin system that mkdocs-material and mkdocstrings use.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
notebooks = [
    "jupyter>=1.0",
    "nbconvert>=7.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# Metadata lives in the standard [project] table. This only adds files to the
# sdist beyond the package itself.
include = [
    { path = "tests", format = "sdist" },
    { path = "CHANGELOG.md", format = "sdist" },
]

# `poetry install` installs the test and lint groups; opt into these with
# `poetry install --with docs,notebooks`.
[tool.poetry.group.docs]
optional = true

[tool.poetry.group.notebooks]
optional = true

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
# Markdown is excluded because docs deliberately show "bad" style examples.
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "NPY", # numpy-specific rules
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
    "G",   # flake8-logging-format
]
ignore = [
    "RUF001", # ambiguous unicode characters in strings (math symbols are intentional)
    "RUF002", # ambiguous unicode characters in docstrings
    "RUF003", # ambiguous unicode characters in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["NPY002"]
"examples/**" = ["NPY002", "E501"]
"benchmarks/**" = ["NPY002", "E501"]
"scripts/**" = ["NPY002", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["imputation_methods"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
files = ["src/imputation_methods"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = ["scipy.*", "sklearn.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest & coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "src/imputation_methods"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--doctest-modules",
    "--import-mode=importlib",
    "-m",
    "not benchmark",
]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS", "NUMBER"]
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "benchmark: wall-clock performance checks, skipped by default (run with '-m benchmark')",
]
filterwarnings = [
    # Fail on deprecations triggered by our own code so upstream API changes
    # (pandas, NumPy, scikit-learn) are caught before they become errors.
    "error::FutureWarning:imputation_methods",
    "error::DeprecationWarning:imputation_methods",
    # Using a renamed API anywhere in the tests or doctests is an error; tests that
    # check the deprecations catch these warnings explicitly with pytest.warns.
    "error:imputation-methods:FutureWarning",
    "ignore::sklearn.exceptions.ConvergenceWarning",
]
xfail_strict = true

[tool.coverage.run]
source = ["imputation_methods"]
branch = true

[tool.coverage.paths]
source = ["src/imputation_methods", "*/site-packages/imputation_methods"]

[tool.coverage.report]
# CI fails if total coverage drops below this. Raise it as coverage improves.
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
