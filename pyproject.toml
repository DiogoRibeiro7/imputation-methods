[tool.poetry]
name = "imputation-showcase"
version = "0.1.0"
description = "Comprehensive showcase of 16+ imputation techniques for handling missing data in Python"
authors = ["Diogo Ribeiro <dfr@esmad.ipp.pt>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/DiogoRibeiro7/imputation-showcase"
repository = "https://github.com/DiogoRibeiro7/imputation-showcase"
documentation = "https://github.com/DiogoRibeiro7/imputation-showcase#readme"
keywords = [
    "imputation",
    "missing-data",
    "data-science",
    "machine-learning",
    "pandas",
    "sklearn",
    "data-preprocessing",
    "statistics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
packages = [{include = "imputation_showcase"}]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.0"
numpy = "^1.24"
scikit-learn = "^1.4"
fancyimpute = "0.7.0"
ppca = "^0.0.4"
matplotlib = "^3.7"
seaborn = "^0.12"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
flake8 = "^6.0"
mypy = "^1.16.1"
coverage = "^7.9.2"
nbconvert = "^7.0"
jupyter = "^1.0"
mkdocs = "^1.5"
mkdocs-material = "^9.5"
mkdocstrings = {extras = ["python"], version = "^0.24"}
# Security: minimum versions to address known vulnerabilities
setuptools = ">=78.1.1"
cryptography = ">=43.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
max-line-length = 88

[tool.mypy]
# Import discovery - focus on main library package
files = ["imputation_showcase"]
mypy_path = "imputation_showcase"
namespace_packages = true

# Platform configuration
python_version = "3.10"
platform = "linux"

# Disallow dynamic typing
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = true
disallow_subclassing_any = true

# Disallow untyped definitions and calls
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true

# None and Optional handling
no_implicit_optional = true
strict_optional = true

# Configuring warnings
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = false
warn_unreachable = true

# Strictness
implicit_reexport = false
strict_equality = true
extra_checks = true

# Configuring error messages
show_error_context = true
show_column_numbers = true
show_error_codes = true
pretty = true
color_output = true
error_summary = true

# Miscellaneous
warn_unused_configs = true

# Third-party imports (many scientific packages lack type stubs)
ignore_missing_imports = true

# Relaxed settings for tests and examples (optional code)
[[tool.mypy.overrides]]
module = ["tests.*", "examples.*", "benchmarks.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = false
