name: Bug Report
description: File a bug report to help us improve
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal Reproducible Example
      description: A short, self-contained snippet with a small dataframe that shows the problem
      placeholder: |
        import numpy as np
        import pandas as pd
        from imputation_methods import MeanImputer

        df = pd.DataFrame({"a": [1.0, np.nan, 3.0]})
        MeanImputer().impute(df)
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: I expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: Instead, I got...
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Error Traceback
      description: Please paste the full error traceback if applicable
      placeholder: Paste the full error message here
      render: python

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: |
        Output of:
        `python -c "import sys, pandas, numpy, sklearn, imputation_methods as m; print(sys.version, pandas.__version__, numpy.__version__, sklearn.__version__, m.__version__)"`
      render: text
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation Method
      description: How did you install the package?
      options:
        - pip
        - uv
        - poetry
        - conda
        - from source
        - other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: Any additional information that might be helpful

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
