name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install
        run: uv pip install -e . --group lint
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy

  test:
    name: >-
      Test (Python ${{ matrix.python-version }}, ${{ matrix.os }}${{
      matrix.resolution == 'lowest-direct' && ', minimum dependencies' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        resolution: [highest]
        include:
          - os: windows-latest
            python-version: "3.13"
            resolution: highest
          - os: macos-latest
            python-version: "3.13"
            resolution: highest
          # Oldest versions allowed by pyproject.toml, to keep lower bounds honest.
          - os: ubuntu-latest
            python-version: "3.10"
            resolution: lowest-direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install
        run: uv pip install -e . --group test --resolution ${{ matrix.resolution }}
      - name: Show versions
        run: uv pip list
      - name: Test
        run: pytest --cov --cov-report=xml
      - name: Upload coverage
        if: >-
          matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' &&
          matrix.resolution == 'highest'
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install
        run: uv pip install -e . --group docs
      - name: Build
        run: mkdocs build --strict

  examples:
    name: Notebooks and examples
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install
        run: uv pip install -e ".[viz]" --group notebooks
      - name: Execute notebooks
        run: >-
          jupyter nbconvert --to notebook --execute
          --output-dir "$RUNNER_TEMP/notebooks" notebooks/*.ipynb
      - name: Run example scripts
        # From the repository root, as documented: the scripts write their
        # figures to examples/.
        run: |
          for script in examples/*.py; do
            echo "::group::$script"
            python "$script"
            echo "::endgroup::"
          done

  package:
    name: Build and check distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - name: Test the built wheel
        run: |
          uv venv .wheel-venv
          VIRTUAL_ENV=.wheel-venv uv pip install dist/*.whl --group test
          # Run from a directory without the source tree so the wheel is imported.
          cp -r tests /tmp/wheel-tests
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -c \
            "import imputation_methods, sys; print(imputation_methods.__version__, imputation_methods.__file__)"
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -m pytest wheel-tests -q \
            -p no:cacheprovider -m "not benchmark"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
