site_name: imputation-methods
site_description: A unified pandas API for 40+ missing-data imputation methods
site_author: Diogo Ribeiro
site_url: https://diogoribeiro7.github.io/imputation-methods/

repo_name: DiogoRibeiro7/imputation-methods
repo_url: https://github.com/DiogoRibeiro7/imputation-methods
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2025-2026 Diogo Ribeiro

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://pandas.pydata.org/docs/objects.inv
            - https://numpy.org/doc/stable/objects.inv
          options:
            docstring_style: google
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_source: true
            show_root_heading: false
            show_root_toc_entry: false
            heading_level: 2
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DiogoRibeiro7
    - icon: fontawesome/solid/envelope
      link: mailto:diogo.debastos.ribeiro@gmail.com

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Basic Concepts: getting-started/concepts.md
  - User Guide:
      - Imputation Methods: user-guide/methods.md
      - Method Selection: user-guide/selection.md
      - Evaluation Metrics: user-guide/evaluation.md
      - Best Practices: user-guide/best-practices.md
  - Examples:
      - Time Series: examples/time-series.md
      - ML Pipelines: examples/ml-pipeline.md
      - Custom Imputers: examples/custom-imputers.md
  - API Reference:
      - Overview: api/index.md
      - Base class: api/base.md
      - Statistical: api/statistical.md
      - Donor sampling: api/sampling.md
      - Time series: api/time-series.md
      - Nearest neighbors: api/neighbors.md
      - Regression: api/regression.md
      - Iterative: api/iterative.md
      - Matrix completion: api/matrix.md
      - Neural networks: api/neural.md
      - Ensembles: api/ensemble.md
      - Functional API: api/functional.md
      - Metrics: api/metrics.md
  - Contributing:
      - Guidelines: contributing/guidelines.md
      - Development Setup: contributing/development.md
      - Code Style: contributing/code-style.md
  - Roadmap: roadmap.md
  - Changelog: changelog.md
